name: Cleanup article history

# 每周自动清理 data/article-history.json，仅保留最近 7 天的缓存，避免文件无限膨胀。
# - 定时：每周日 04:17 UTC（= 北京时间 12:17）触发一次
# - 手动：在 Actions 页面点 "Run workflow" 可立即执行，并可覆盖保留天数
# 移植自 gzinfo .github/workflows/cleanup-history.yml。
on:
  schedule:
    - cron: '17 4 * * 0'
  workflow_dispatch:
    inputs:
      retention_days:
        description: '保留最近多少天（默认 7）'
        required: false
        default: '7'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Trim article-history.json to recent window
        env:
          RETENTION_DAYS: ${{ github.event.inputs.retention_days || '7' }}
        run: node scripts/cleanup-history.mjs

      # 体积监控（2026-09-14 C-4-5）：只告警不阻断。
      # 背景：审计 P2-4 记录的「126 条 / 82KB」已过时，2026-09-14 实测为 274 条 / 约 231KB
      # （+13 条噪音清理后）—— 随源扩增会继续增长，需要一个可见的阈值哨兵，
      # 避免再次「没人发现它膨胀到多大」。
      - name: 体积检查（超阈值告警，不阻断）
        run: |
          set -euo pipefail
          f=data/article-history.json
          if [ ! -f "$f" ]; then echo "::warning::$f 不存在，跳过体积检查"; exit 0; fi
          kb=$(( $(wc -c < "$f" | tr -d ' ') / 1024 ))
          count=$(node -e "console.log(Object.keys(require('./data/article-history.json')).length)")
          echo "article-history.json：${count} 条 / ${kb} KB（阈值 400 KB）"
          if [ "$kb" -gt 400 ]; then
            echo "::warning::article-history.json 已达 ${kb} KB / ${count} 条（阈值 400 KB）——请检查保留窗口与源噪音，参见 docs/review-2026-09-14-arch.md P2-4"
          fi

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/article-history.json data/article-history-backup.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: 清理历史缓存，仅保留最近 ${RETENTION_DAYS:-7} 天 ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash origin main || true
            git push
          fi
