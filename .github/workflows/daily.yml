name: daily

# 每日资信简报：构建（架构门禁 → 类型 → 测试 → 全 AI 管线 → TTS）→ GitHub Pages 发布。
#
# 发布门控（对齐 gzinfo 口径，2026-09-11 B5）：一天只发一次**正式版**。
#   - gate 读 main 的 data/publish-state.json，判据 =「当天是否已正式生效」
#     （source=schedule 或 manual-final）；是则整个 run 跳过（不重复跑全 AI / TTS / 发布）。
#     manual-test（验证抢跑）不阻断；workflow_dispatch 手动触发永远跑（用户选择优先）。
#   - 发布成功后部署 job 之后的 record job 才写 publish-state.json（先发后记）；
#     次日/后续 schedule 据此跳过，凌晨 dispatch 测试不再吞掉当天正式首发。
#   定时调度（2026-09-16 恢复，用户口径：**每天 07:30–07:50 之间跑**）：
#     · `30 23 * * *`（UTC）= 北京 07:30 主跑；`45 23 * * *` = 北京 07:45 补跑。
#       GitHub 定时任务可能延迟，补跑由 gate「当天已正式生效则跳过」兜底 —— **不会重复发布，
#       也不会重复烧 LLM**（gate 在 build 之前判定，跳过即整个 run 不执行）。
#     · 仍保留 workflow_dispatch 手动触发（gate 对手动一律放行，用户选择优先）。
#     · 推送（notify.yml）仍为**人工触发**：07:30 出刊后可先在页面上核对内容，再点推送。
#
# 音频：AUDIO_ENABLED=true → **阿里云百炼 CosyVoice 优先**（DASHSCOPE_API_KEY secret）
#       → 模型链缺省 cosyvoice-v3.5-flash（2026-09-25 用户决定不再采用 v3.5-plus；如需可在
#         repo variable DASHSCOPE_TTS_MODELS 里自行加回，链会按序降级）
#       → 全失败才用腾讯云 TTS 兜底（TENCENTCLOUD_* secrets）
#       → 云端全挂则本轮降级为无播放器（不阻断发布；Piper 兜底为本地能力，CI 不预装）。
#       audio input=false 或 SKIP_TTS=true 可跳过合成（省 TTS 成本，仍拼口播稿）。
#       ⚠️ 改音色要**两处同步**：本文件的 DASHSCOPE_TTS_MODELS（CI）+ 根目录 .env（本地）。

on:
  schedule:
    # 北京时间 07:30 / 07:45（cron 为 UTC；北京 = UTC+8，无夏令时）
    - cron: "30 23 * * *"
    - cron: "45 23 * * *"
  workflow_dispatch:
    inputs:
      audio:
        description: "生成语音播报（百炼 CosyVoice 优先 → 腾讯 TTS 兜底）；取消勾选 = 只拼口播稿不合成"
        type: boolean
        default: true
      publish:
        description: "发布到 GitHub Pages（取消勾选 = 仅构建 + 上传 artifact 验证）"
        type: boolean
        default: true
      release_mode:
        description: "手动发布性质：final=当天正式终版（阻断同日 cron 重复发布）；test=验证抢跑（不阻断 cron 首发）"
        type: choice
        options:
          - final
          - test
        default: final

permissions:
  contents: write   # 归档历史库 / 记账 publish-state 需 push main（2026-09-11 B5）
                    # 2026-09-14：发布改为推送 gh-pages 分支（peaceiris 用 GITHUB_TOKEN push），
                    # 仍只需 contents: write；已移除 pages: write / id-token: write
                    # （artifact 式部署 upload-pages-artifact + deploy-pages 已删除）。

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # 后端由 repo 变量 LLM_BACKEND 控制（默认回落 dump）：仓库 Settings→Variables 设 LLM_BACKEND=deepseek 即线上直跑；
  # 未配 secrets.DEEPSEEK_API_KEY 时启动校验会失败（预期行为，等用户填 key）。
  LLM_BACKEND: ${{ vars.LLM_BACKEND || 'dump' }}

jobs:
  gate:
    name: 当日已发布检查
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - uses: actions/checkout@v4
      - name: Check publish state (today already in effect?)
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # 手动触发永远跑（用户选择 = 最高优先级）
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual trigger — proceeding"
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 注意：TZ 必须**双引号**展开（单引号不展开 → date 退回 UTC → 取到前一天，
          # 定时任务会永远跳过；2026-09-02 gzinfo 修复）。
          TODAY=$(TZ="Asia/Shanghai" date +%Y-%m-%d)
          echo "Report date (tz=${REPORT_TZ:-Asia/Shanghai}): ${TODAY}"
          # 判据改为「当天是否已正式生效」：读 main 的 data/publish-state.json。
          # 只认 source=schedule 或 manual-final；manual-test / 裸 manual / 无记录 / 损坏 → 未发布。
          if [ -f data/publish-state.json ]; then
            IN_EFFECT=$(node -e "const s=JSON.parse(require('fs').readFileSync('data/publish-state.json','utf8'));const e=(s.reports||{})[process.argv[1]];process.stdout.write(e&&(e.source==='schedule'||e.source==='manual-final')?'yes':'no')" "$TODAY" 2>/dev/null || echo no)
          else
            IN_EFFECT=no
          fi
          echo "publish-state in-effect=${IN_EFFECT}"
          if [ "$IN_EFFECT" = "yes" ]; then
            echo "→ 今日正式版已生效（publish-state: schedule/manual-final），跳过（gzinfo 口径：一天一次正式发布）"
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          else
            echo "→ 今日尚未正式发布 — proceeding"
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 架构门禁
        run: npm run architecture:check
      - name: 类型检查
        run: npm run typecheck

      # 探测腾讯密钥（step 级 if 不支持 secrets 上下文，先转输出）
      - name: Detect Tencent TTS secret
        id: tencent-check
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
        run: |
          if [ -n "${TENCENTCLOUD_SECRET_ID}" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 TENCENTCLOUD_SECRET_ID — 语音播报将降级（无音频）"
          fi

      # 探测百炼密钥（仅提示；缺了会自动跳过 cosyvoice 后端、回到腾讯，不算错误）
      - name: Detect DashScope TTS secret
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          if [ -n "${DASHSCOPE_API_KEY}" ]; then
            echo "✅ 已配置 DASHSCOPE_API_KEY — 语音播报优先走百炼 CosyVoice"
          else
            echo "::notice::未配置 DASHSCOPE_API_KEY — 跳过百炼，语音播报直接用腾讯云 TTS"
          fi

      # ---------- ffmpeg（腾讯分片重编码 concat 必需，始终安装）----------
      - name: Install ffmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already present: $(ffmpeg -version 2>/dev/null | head -1)"
          else
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          command -v ffmpeg >/dev/null 2>&1 || { echo "::error::ffmpeg 安装失败"; exit 1; }

      # ---------- 恢复 gh-pages 历史到 site/（发布根只保留最近 7 天 history/ 之外的长期归档）----------
      # gh-pages 分支是**长期归档**：history/ 只留 7 天，靠本步把更早期的报告带进发布根，
      # build-site 再以「gh-pages ∪ history ∪ 当日」重建 —— 故 gh-pages 事实上是无限期归档。
      # 2026-09-14 修正：原判据 `ls site/*.html` 是**扁平布局时代的残留**，子目录布局下恒为 0；
      # 且原实现无失败保护。现改为按期次计数，并在「分支存在却恢复出 0 期」时**中止**，
      # 因为后续 peaceiris 是整树替换 —— 恢复失败会让已发布历史被清空。
      - name: Restore existing reports from gh-pages
        run: |
          set -euo pipefail
          mkdir -p site
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git archive origin/gh-pages | tar -x -C site
            restored=$(find site -mindepth 2 -maxdepth 2 -name '*.html' | wc -l | tr -d ' ')
            echo "Restored ${restored} 期 from gh-pages"
            if [ "$restored" = "0" ]; then
              echo "::error::gh-pages 分支存在但未恢复出任何期次 —— 中止，以免清空已发布历史"
              exit 1
            fi
          else
            echo "gh-pages 分支不存在 — 首次发布"
          fi

      # 生成当日报告（全 AI 流程）。
      # PUBLISH_RUN：本 run 的内容是否算「正式交付口径」→ 内容记忆（side-exec-summary 的
      #   persistMemory）与 IPO 口播记忆（pipeline/index.ts）只在此为 true 时落盘。
      #   2026-09-11 B5 补齐（此前 workflow 从未设置 → 记忆永不落盘，CI 每日从零开始）：
      #   schedule 依赖 gate 判定（should-run=true 即首发）；dispatch 用 inputs.publish。
      - name: 生成每日简报
        run: npm run daily
        env:
          LLM_BACKEND: ${{ vars.LLM_BACKEND || 'dump' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          REPORT_LOCALE: ${{ vars.REPORT_LOCALE || 'zh' }}
          # 分享卡片基址（2026-09-14 P1-2）：渲染 og:image 的绝对地址前缀。
          # 此前 full.ts 硬编码回落到**旧仓库** gzinfo 的 gh-pages 域，而本仓库没有
          # og-image.png → 每次发布的转发缩略图都是外域 404。现改为显式注入；
          # 留空则渲染层不输出 og:image（宁可无缩略图也不指向他仓）。
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL || 'https://shengc-shv.github.io/gzinfols' }}
          # Web 模式（2026-09-14 B-4 用户拍板开启）：渲染页面内的「归档」链接。
          # 依赖 archive.html —— 由 build-site 生成，且它会从 history/（CI 每期归档回 main）
          # 汇集历史各期，故归档页会有多期而不是只有当天一期。
          WEB_MODE: 'true'
          # 2026-09-16 修：**release_mode=test（验证抢跑）不写记忆**——test run 发布 gh-pages
          # 但不推微信；若写暂存区，次日 beginDay 会按「该日已有交付记录」把它结算进长期记忆，
          # 使从未送达客户的内容被误判「已播」而在次日被去重（实证：09-16 晚间 test run 写入
          # 15 条暂存 + 交付记录指纹缺失 → 次日本会误结算）。发布行为不受此开关影响。
          PUBLISH_RUN: ${{ (github.event_name == 'schedule' && needs.gate.outputs.should-run == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.release_mode != 'test') }}
          # —— 语音播报（百炼 CosyVoice 优先 → 腾讯兜底）——
          AUDIO_ENABLED: ${{ (github.event_name == 'schedule' || inputs.audio) && 'true' || 'false' }}
          SKIP_TTS: ${{ vars.SKIP_TTS }}
          # 百炼：Key 走 secret；模型链明文（voice ID 不是凭据，可用 repo variable 覆盖）
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_TTS_MODELS: ${{ vars.DASHSCOPE_TTS_MODELS || 'cosyvoice-v3.5-flash@cosyvoice-v3.5-flash-vd-bailian-0e33aa8c9a414c92b80dff0350fc6574' }}
          # 腾讯云（兜底）
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENTCLOUD_REGION: ${{ vars.TENCENTCLOUD_REGION }}
          TTS_VOICE_TYPE: ${{ vars.TTS_VOICE_TYPE }}
          TTS_SPEED: ${{ vars.TTS_SPEED }}
          TTS_PRONOUNCE: ${{ vars.TTS_PRONOUNCE }}

      # ---------- 历史库裁剪（近 N 天保留 + 累积备份，2026-09-11 B5 补齐）----------
      # daily 会重写 data/article-history.json（含当日 + 被灌入的旧缓存）。先裁到最近 N 天
      # （默认 7），被移除数据累积写入 data/article-history-backup.json（不丢弃）。
      - name: Trim history to recent N days (keep backup)
        run: node scripts/cleanup-history.mjs

      # ---------- 红筹监测（抓取→判定→存储）----------
      # 2026-09-17 前移：原先它排在「归档提交」之后，导致当日生成的 `data/redchip/leads.json`
      # 永远赶不上那一轮提交（要等次日才入库）→ 线上红筹面板恒为「共 1 家」。
      # 现置于归档之前，与 history/ 同批提交；台账缺失时脚本只记日志、不阻断发布。
      - name: 红筹监测（抓取→判定→存储）
        run: npx tsx scripts/redchip-monitor.ts --live --limit 20
        continue-on-error: true

      # ---------- 归档报告到 main/history/ + 提交滚动历史库（2026-09-11 B5 补齐）----------
      # 此前完全缺失 → CI 每次 runner 从零开始（历史库/记忆库不回流 main）。
      # 逐字对齐 gzinfo daily.yml 的归档步骤（2026-09-10 #201 并发教训）。
      - name: Archive reports to history/ + commit rolling history
        run: |
          # 1) 归档唯一存储里的报告到 main/history/：2.0 唯一存储 = daily_reports/<date>/
          #    （<date>.html/.json/.md + audio/；gzinfo 的 data/history/reports/<date>/ 对应物，
          #     见 parity-plan R3）。cp 到已存在的 history/<date>/（writeExecStore 写的 store.json
          #     所在目录）→ 合并为同一目录：报告文件 + store.json 同构 gzinfo 的 history/<date>/。
          #    保留 [ -d ] 守卫：首次运行尚无产物时不报错。
          mkdir -p history
          for d in daily_reports/20*/; do
            [ -d "$d" ] && cp -r "$d" history/
          done
          # 2) 提交历史库 + 报告归档（存在才 add —— 首次运行可选文件可能尚未生成）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/
          for f in data/article-history.json data/article-history-backup.json data/event-memory.json data/redchip/leads.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          if git diff --cached --quiet; then
            echo "历史文件与报告归档无变化，跳过提交"
          else
            git commit -m "chore: 更新历史缓存并归档报告 ($(date -u +%Y-%m-%d))"
            # 3) 推送（免疫并发，2026-09-10 #201 教训）：运行期间远端可能被人工 push
            #    或其他 workflow 推进，checkout 是 fetch-depth: 1 → 裸 push 必被拒。
            #    先 fetch + merge -X ours（冲突时保住本 run 生成的新产物），失败重试 3 次。
            pushed=0
            for i in 1 2 3; do
              git fetch origin main --depth=200 || true
              git merge -X ours --no-edit -m "chore: 合并远端 main（CI 收尾）" origin/main || true
              if git push; then pushed=1; break; fi
              echo "::warning::归档 push 第 $i 次失败，3s 后重试"
              sleep 3
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::归档 push 连续 3 次失败"
              exit 1
            fi
          fi

      # ---------- 站点聚合（2026-09-14 B-3 接线）----------
      # 位置必须在「归档到 history/」之后：build-site 从 daily_reports/（当日）+ history/（历史各期）
      # 汇集到发布根 site/<date>/，并生成 index.html / archive.html / .nojekyll / og-image.png。
      # 此前 `npm run build-site` **从未在 CI 执行**（直接上传 site/），导致：
      #   ① og-image.png 不在发布根 → og:image 404；② 无 .nojekyll（Pages 会跑 Jekyll）；
      #   ③ 无 archive.html → 报告页里的「归档」链接（WEB_MODE）落空。
      # 同时它也是 publishReport 扁平站点布局与归档链接不兼容问题的收敛点（现统一为子目录布局）。
      #
      # 注：红筹监测（redchip-monitor）已前移到「归档提交」之前，见上方同名步骤 ——
      # 它必须在提交之前跑，当日生成的 data/redchip/leads.json 才能入库。

      # B1 检索索引（2026-09-17）：必须在 build-site **之前**跑 —— build-site 只读现成索引
      # 并据此生成 site/search.html（缺索引时会现跑一次兜底，但显式跑更可控、日志更清楚）。
      - name: 检索索引（build:index → build/search-index/）
        run: npm run build:index
        continue-on-error: true

      - name: 站点聚合（build-site：汇集各期 + index/archive/.nojekyll/og-image/search）
        run: npm run build-site

      # （dump 后端已弃用：线上直跑 DeepSeek，不再产生 data/llm-dump/，对应 artifact 上传已移除）

      # ---------- 发布到 gh-pages 分支（2026-09-14：修复「Pages 从未启用」）----------
      # 根因实测：本仓库 GitHub Pages **从未启用**（GET /repos/shengc-shv/gzinfols/pages → 404），
      # 而此前工作流用的是 artifact 式部署（upload-pages-artifact + deploy-pages），
      # 在站点未启用时必然失败（「Get Pages site failed」）→ 4 次 daily 运行**全部**卡在
      # deploy 步骤失败，线上 https://shengc-shv.github.io/gzinfols/ 一直是
      # 「Site not found · GitHub Pages」——即发布链路从未真正跑通。
      # 现改为与 gzinfo 同款**分支式发布**（peaceiris → gh-pages 分支；
      # Pages 源 = Deploy from a branch: gh-pages / ，build_type=legacy），
      # 该机制在本账号已验证可用（gzinfo 站点 build_type=legacy / status=built）。
      # keep_files 取默认 false（整树替换）：site/ 已由「gh-pages 恢复 + history/ + 当日」
      # 重建为完整快照，整树替换因此是自愈的（前一步已加恢复失败保护，不会清空历史）。
      - name: 发布到 gh-pages
        if: ${{ github.event_name == 'schedule' || inputs.publish == true }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          commit_message: "publish: 站点快照 ${{ github.run_id }}"

      - name: 存档 daily_reports
        uses: actions/upload-artifact@v4
        with:
          name: daily-reports-${{ github.run_id }}
          path: daily_reports
          retention-days: 30

  # ---------- 发布来源记账（2026-09-11 B5；对齐 gzinfo「先发后记」）----------
  # 独立 job，needs: build → 发布已改为 build job 内的「发布到 gh-pages」步骤，
  # 该步骤失败则 build 整体失败 → 本 job 不运行，因果序「先发布成功、后记账」依然成立。
  # 避免「记了没发」导致次日误判已发布。SOURCE 由触发方式计算：
  #   schedule → schedule；dispatch + release_mode=test → manual-test；否则 → manual-final。
  record:
    needs: build
    if: ${{ github.event_name == 'schedule' || inputs.publish == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Record publish source (publish-state.json)
        env:
          REPORT_TZ: ${{ vars.REPORT_TZ }}
          SOURCE: ${{ github.event_name == 'schedule' && 'schedule' || (inputs.release_mode == 'test' && 'manual-test' || 'manual-final') }}
        run: |
          npm run record-publish --silent
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/publish-state.json
          if git diff --cached --quiet; then
            echo "publish-state 无变化，跳过提交"
          else
            git commit -m "chore: 记录发布来源 (publish-state.json)"
            # 与归档步骤同样的并发免疫：先 fetch + merge -X ours，再 push，失败重试 3 次。
            pushed=0
            for i in 1 2 3; do
              git fetch origin main --depth=200 || true
              git merge -X ours --no-edit -m "chore: 合并远端 main（CI 收尾）" origin/main || true
              if git push; then pushed=1; break; fi
              echo "::warning::publish-state push 第 $i 次失败，3s 后重试"
              sleep 3
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::publish-state push 连续 3 次失败"
              exit 1
            fi
          fi
