name: daily

on:
  schedule:
    # 工作日三次，对应北京时间（CST = UTC+8）：
    # 06:30 CST → UTC 22:30（前一日，周日~周四）；12:00 CST → UTC 04:00；17:30 CST → UTC 09:30
    - cron: "30 22 * * 0-4" # 周一至周五 06:30 北京时间
    - cron: "0 4 * * 1-5"   # 周一至周五 12:00 北京时间
    - cron: "30 9 * * 1-5"  # 周一至周五 17:30 北京时间
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 架构门禁
        run: npm run architecture:check
      - name: 类型检查
        run: npm run typecheck
      - name: 单元测试
        run: npm test
      - name: 生成每日简报
        run: npm run daily
        env:
          # CI 统一用 deepseek 账号跑（Actions 环境没有已登录的 claude CLI）
          LLM_BACKEND: deepseek
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REPORT_TZ: Asia/Shanghai
          REPORT_LOCALE: zh
      - name: 上传产物（Pages）
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: 存档 daily_reports
        uses: actions/upload-artifact@v4
        with:
          name: daily-reports-${{ github.run_id }}
          path: daily_reports
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
