    var sub = document.createElement('div');
    sub.className = 'sub';
    sub.textContent = '跨 ' + (t.dates || []).length + ' 期（' + (t.dates[0] || '') + ' ~ ' +
      (t.dates[t.dates.length-1] || '') + '，约 ' + (t.spanDays || 1) + ' 天）';
    box.appendChild(sub);
    if ((t.tags || []).length) {
      var chips = document.createElement('div');
      chips.className = 'chips';
      t.tags.forEach(function(g){
        var c = document.createElement('span');
        c.className = 'chip';
        c.textContent = g;
        chips.appendChild(c);
      });
      box.appendChild(chips);
    }
    var ol = document.createElement('ol');
    ol.className = 'tl';
    (t.nodes || []).forEach(function(n){
      var li = document.createElement('li');
      var d = document.createElement('span');
      d.className = 'd';
      d.textContent = n.date || '';
      li.appendChild(d);
      var tw = document.createElement('span');
      tw.className = 't';
      var a = document.createElement('a');
      a.href = './' + n.date + '/' + n.date + '.html#itm-' + String(n.i || '').replace(/^itm-/, '');
      a.textContent = n.t || '(无标题)';
      tw.appendChild(a);
      li.appendChild(tw);
      var meta = document.createElement('span');
      meta.className = 'tag2';
      meta.textContent = (SECTIONS[n.k] || n.k) + (n.s ? ' · ' + n.s : '');
      li.appendChild(meta);
      if (n.repeat && n.repeat > 1) {
        var r = document.createElement('span');
        r.className = 'repeat';
        r.textContent = '持续 ' + n.repeat + ' 期';
        li.appendChild(r);
      }
      ol.appendChild(li);
    });
    box.appendChild(ol);
    list.appendChild(box);
  });
})();
</script>
</body>
</html>
