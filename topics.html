      meta.className = 'tag2';
      meta.textContent = (SECTIONS[n.k] || n.k) + (n.s ? ' · ' + n.s : '');
      li.appendChild(meta);
      if (n.repeat && n.repeat > 1) {
        var r = document.createElement('span');
        r.className = 'repeat';
        r.textContent = '持续 ' + n.repeat + ' 期';
        li.appendChild(r);
      }
      ol.appendChild(li);
    });
    box.appendChild(ol);
    list.appendChild(box);
  });
})();
</script>
</body>
</html>
